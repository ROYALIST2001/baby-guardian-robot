# Define a web server that listens on port 80 (the normal web port).
server {
    listen 80;

    # Any request whose address starts with /api/ is sent to the Node backend.
    location /api/ {
        # "node-backend" is the container's name (set in docker-compose below).
        # Containers can reach each other by name on Docker's private network.
        proxy_pass http://node-backend:3000/;
    }

    # Any request starting with /ai/ is sent to the Python backend.
    location /ai/ {
        proxy_pass http://python-backend:8000/;
    }
}