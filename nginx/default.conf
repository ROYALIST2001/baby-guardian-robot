server {
    listen 80;

    # Normal API requests go to the Node backend.
    location /api/ {
        proxy_pass http://node-backend:3000/;
    }

    # AI requests go to the Python backend.
    location /ai/ {
        proxy_pass http://python-backend:8000/;
    }

    # NEW: Socket.IO live connections go to the Node backend.
    # These extra lines let the connection stay open (the "upgrade").
    location /socket.io/ {
        proxy_pass http://node-backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}